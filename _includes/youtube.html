<figure class="video">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id | escape }}" title="{{ include.title | default: 'YouTube video' | escape }}" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  {% if include.caption %}<figcaption>{{ include.caption | escape }}</figcaption>{% endif %}
</figure>
